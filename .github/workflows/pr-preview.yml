---

name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: deploy-doc

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install and Build
        if: github.event.action != 'closed'
        run: |
          pip install -r requirements.txt
          mkdocs build

      # Drop the CNAME from the preview build so it is not carried into pr-preview/pr-N/. GitHub only
      # reads the CNAME at the gh-pages root, so this is cosmetic, but keeps the domain out of previews.
      # Guarded so the production repo (strangebeecorp) is never affected.
      - name: Strip CNAME from preview build
        if: github.event.action != 'closed' && github.repository != 'strangebeecorp/docs'
        run: rm -f site/CNAME

      # https://github.com/rossjrw/pr-preview-action
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: solid-bassoon-mrqy18o.pages.github.io
          pages-base-path: .
          comment: true

