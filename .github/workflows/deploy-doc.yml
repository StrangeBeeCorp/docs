---
name: Deploy doc in production

on:
  push:
    branches:
      - main

concurrency: deploy-doc

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, type=ephemeral, size=medium, domain=sb]
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      - name: Define cache_id
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Setup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install python requirements.txt
        run: pip install -r requirements.txt

      - name: Build doc
        run: mkdocs build

      # This private repo publishes to an access-controlled *.pages.github.io URL and must NOT claim
      # docs.strangebee.com — that custom domain belongs to the strangebeecorp/docs production site.
      # Two Pages sites cannot claim the same domain, so keeping the CNAME here fails this repo's
      # Pages build. Guarded so the production repo (strangebeecorp) keeps its CNAME untouched.
      - name: Strip CNAME on the private preview repo
        if: github.repository != 'strangebeecorp/docs'
        run: rm -f site/CNAME

      - name: Checkout ${{ github.repository }} gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages  # clone in $GITHUB_WORKSPACE/gh-pages/

      - name: Copy build results
        run: |
          rsync -av \
            --delete \
            --checksum \
            --exclude .git/ \
            --exclude pr-preview/ \
            site/ $GITHUB_WORKSPACE/gh-pages/

      # mkdocs output is already static; disable the legacy Pages Jekyll build so it does not run out
      # of disk on this large multi-product preview site. Guarded so strangebeecorp production is
      # untouched (its gh-pages holds no PR previews and builds fine as-is).
      - name: Disable Jekyll on the private preview repo
        if: github.repository != 'strangebeecorp/docs'
        run: touch $GITHUB_WORKSPACE/gh-pages/.nojekyll

      - name: Commit and push
        run: |
          cd $GITHUB_WORKSPACE/gh-pages/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Auto build/deploy docs from main branch" || exit 0
          git push --force origin gh-pages
